[project]
name = "mission-control"
version = "0.1.0"
description = "Control plane for supervising AI-agent runtimes (Hermes, OpenClaw, Claude Code, Codex) and a model gateway through stable adapter interfaces."
readme = "README.md"
authors = [
    { name = "epixia", email = "info@epixia.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
mission-control = "mission_control:main"
mission-control-server = "mission_control.server.__main__:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
